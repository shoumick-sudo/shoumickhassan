services:
  - type: web
    name: stp-monitoring-portal
    runtime: node
    region: singapore
    plan: free
    rootDir: portal/stp-monitoring
    buildCommand: npm ci --include=dev && npm test && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.14.0
      - key: DATABASE_URL
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
